<div class="header">
  <div class="jlpt">{{#JLPT}}JLPT: N{{JLPT}}{{/JLPT}}</div>
</div>
<div class="sentence"><span id="sm" style="visibility:hidden">{{Sentence}}</span>{{#SentenceMod}}<span
    class="modifier">({{SentenceMod}})</span>{{/SentenceMod}}</div>
{{#Translation}}<div class="translation">{{Translation}}</div>{{/Translation}}

<script>
  (function () {
    // Front: every #answer# in the Sentence becomes an underlined blank as wide
    // as the answer itself (the text is there but transparent, see style.css).
    var SHOW = false;
    var el = document.getElementById("sm");
    if (!el) return;

    // The front renders the real answer too, just invisible, so both sides
    // have the same widths and line breaks (a row of spaces wraps differently).
    // A plain space before an opening # only separates furigana; drop it.
    var src = el.innerHTML.replace(/ #(?=[一-鿿々〆])/g, "#");
    var parts = src.split(/(<[^>]*>)/); // "#" inside tags (e.g. color="#333") is not a marker
    var out = "", hidden = false, empty = true;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (i % 2) { out += p; continue; }
      var segs = p.split("#");
      for (var k = 0; k < segs.length; k++) {
        if (k) {
          if (hidden && empty && !SHOW) out += '<b class="target gap">　</b>';
          hidden = !hidden;
          empty = true;
        }
        var s = segs[k];
        if (!s) continue;
        if (!hidden) out += s;
        else { out += '<b class="target gap">' + s + "</b>"; empty = false; }
      }
    }

    el.innerHTML = out.replace(
      /\s?([一-鿿々〆]+)\[([^\]]+)\]/g,
      "<ruby>$1<rt>$2</rt></ruby>"
    );
    el.style.visibility = "";
  })();
</script>
